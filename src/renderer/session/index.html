<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self';"
    />
    <link rel="stylesheet" href="session.css" />
    <title>Lore</title>
  </head>
  <body>
    <header id="titlebar">
      <div class="lights">
        <button id="close" class="light close" aria-label="Close"></button>
        <button id="min" class="light min" aria-label="Minimize"></button>
        <button id="zoom" class="light zoom" aria-label="Zoom"></button>
      </div>
      <button id="folder" title="Open this folder in Finder"></button>
    </header>

    <main id="thread">
      <div id="empty">
        <h1>What would you like to do?</h1>
        <p id="emptySub">I can look through this folder, change files, and run things for you.</p>
      </div>
    </main>

    <div id="needsKey" hidden>
      <p>Add your Anthropic API key to get started.</p>
      <button id="openSettings">Open Settings</button>
    </div>

    <footer id="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Ask for anything…"
        autofocus
      ></textarea>
      <button id="send" aria-label="Send">↑</button>
      <button id="stop" aria-label="Stop" hidden>Stop</button>
    </footer>

    <script src="session.js"></script>
  </body>
</html>
