<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>Claude Dock Shortcuts</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #panel {
        height: 100%;
        background: rgba(26, 26, 26, 0.97);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 18px 20px 16px;
        display: flex;
        flex-direction: column;
        -webkit-app-region: drag;
      }
      h1 {
        font-size: 16px;
        font-weight: 700;
        color: #fff;
        text-align: center;
        margin-bottom: 14px;
      }
      dl { flex: 1; display: grid; grid-template-columns: 78px 1fr; row-gap: 8px; align-content: start; }
      dt { font-size: 13px; color: rgb(153, 204, 255); }
      dd { font-size: 13px; color: rgb(204, 204, 204); }
      button {
        -webkit-app-region: no-drag;
        align-self: center;
        margin-top: 12px;
        padding: 7px 22px;
        border: 0;
        border-radius: 6px;
        background: rgb(64, 64, 64);
        color: rgb(230, 230, 230);
        font-family: inherit;
        font-size: 13px;
        cursor: default;
      }
      button:hover { background: rgb(82, 82, 82); }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Claude Dock Shortcuts</h1>
      <dl>
        <dt>⌘⌥T</dt><dd>Toggle dock</dd>
        <dt>⌘⌥N</dt><dd>Add new terminal</dd>
        <dt>⌘⌥M</dt><dd>Minimize all terminals</dd>
        <dt>⌘⌥R</dt><dd>Reload dock</dd>
        <dt>⌥+Click</dt><dd>Rename slot</dd>
        <dt>⇧+Click</dt><dd>Open in a folder…</dd>
        <dt>⌘K</dt><dd>Clear terminal</dd>
      </dl>
      <button id="close">Close</button>
    </div>
    <script src="help.js"></script>
  </body>
</html>
